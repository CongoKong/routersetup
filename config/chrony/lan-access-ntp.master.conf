# -----------------------------------------------------------------------------
# Interface binding
# -----------------------------------------------------------------------------
# Bind NTP server sockets explicitly to the LAN interface addresses.
# This prevents chronyd from listening on WAN, loopback, or unpredictable
# auto‑configured IPv6 addresses.
bindaddress LANIPV4ADDRESS
bindaddress LANIPV6ADDRESS

# Bind the chronyc command socket to localhost only
bindcmdaddress 127.0.0.1
bindcmdaddress ::1

# allow all access but chrony is effectively hosted on the LAN interface,
# so access is limited to local only
allow all

# -----------------------------------------------------------------------------
# Local clock fallback (optional but recommended for routers)
# -----------------------------------------------------------------------------
# When upstream NTP is unreachable, chronyd can still serve time to the LAN.
# Stratum 10 ensures clients never mistake this router for a real upstream source.
local stratum 10

# -----------------------------------------------------------------------------
# Logging (optional)
# -----------------------------------------------------------------------------
#log tracking measurements statistics
#logdir /var/log/chrony

# -----------------------------------------------------------------------------
# Include additional configuration fragments
# -----------------------------------------------------------------------------
# NTP sources (pool/server definitions)
include /etc/chrony/sources.d/regional-pool-ntp.sources

# Additional router‑specific configuration fragments
# include /etc/chrony/conf.d/*.conf
