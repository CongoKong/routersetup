[Unit]
# This tells systemd to wait until the device unit exists and is renamed
BindsTo=sys-subsystem-net-devices-IFWAN.device
After=sys-subsystem-net-devices-IFWAN.device

[Service]
# this service can take up to 120 seconds to start
TimeoutStartSec=120
# wait for the network to be connected
ExecStartPre=/usr/local/bin/network-connected.sh 60 dual IFWAN
