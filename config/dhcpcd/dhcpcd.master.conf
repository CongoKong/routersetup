# A configuration for dhcpcd.
# See dhcpcd.conf(5) for details.

# Inform the DHCP server of our hostname for DDNS.
hostname

# Use the hardware address of the interface for the Client ID.
#clientid
# or
# Use the same DUID + IAID as set in DHCPv6 for DHCPv4 ClientID as per RFC4361.
# Some non-RFC compliant DHCP servers do not reply with this set.
# In this case, comment out duid and enable clientid above.
duid

# Persist interface configuration when dhcpcd exits.
persistent

# For hardening, vendorclassid is set to blank to avoid sending the default of
# dhcpcd-<version>:<os>:<machine>:<platform>
vendorclassid

# dnsmasq manages DNS — do not touch resolv.conf
nohook resolv.conf
# keep DHCP from overriding system hostname
nohook hostname
# keep DHCP from modifying chrony/ntp configuration
nohook ntp.conf

# Ignore upstream DNS/NTP options
# ignore DNS advertisements from upstream router
nooption domain_name_servers
# ignore domain suffix from upstream router
nooption domain_name
# ignore domain suffices to search
nooption domain_search
# ignore NTP configuration from upstream router
nooption ntp_servers

# Routing & MTU
option classless_static_routes
# Respect the network MTU. This is applied to DHCP routes.
option interface_mtu

# A ServerID is required by RFC2131.
require dhcp_server_identifier

# Generate SLAAC address using the Hardware Address of the interface
#slaac hwaddr
# OR generate Stable Private IPv6 Addresses based from the DUID
#slaac private

# Do not listen for RAs (selectively re‑enabled on WAN)
noipv6rs

# Disable 169.254.x.x "link-local" IPv4 addresses (prevent routing confusion)
noipv4ll

# --- INTERFACE SPECIFIC ---

# Only manage these interfaces
allowinterfaces IFWAN IFLAN

# ============================
# WAN Interface configuration (Dual‑Stack)
# ============================
interface IFWAN
    # IPv6: Use EUI‑64 for WAN IID (stable, good for hosting)
    slaac hwaddr

    # DHCPv6: Request a global IPv6 address for the WAN interface
    ia_na 0

    # DHCPv6-PD: Request a prefix and delegate a /64 to LAN
    # Use subnet-ID 1 (RFC3633 §12.1: subnet 0 is the base prefix and fragile in dhcpcd)
    # IFLAN receives ::1 inside the delegated prefix (required by dnsmasq to pick up the prefix)
    ia_pd 0 IFLAN/1/64

    # Enable IPv6 Router Solicitations on WAN only
    ipv6rs

    # Wait for both IPv4 + IPv6 before declaring link "ready" (required for dnsmasq to work)
    waitip 4 6

# ============================
# LAN Interface configuration (Dual‑Stack)
# ============================
interface IFLAN
    # Static IPv4 LAN address
    static ip_address=LANIPV4ADDRESS/LANIPV4CIDR

    # Static IPv6 ULA
    static ip6_address=LANIPV6ADDRESS/64

    # Prevent default routes on LAN
    nogateway
