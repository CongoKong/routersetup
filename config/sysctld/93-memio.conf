############################################################
# Router-focused memory and I/O tuning
############################################################

# Increase the system-wide limit for open file descriptors to 512k
# Ensures the router can sustain large numbers of concurrent connections
fs.file-max = 524288

# Keep a larger free‑memory reserve to avoid allocation stalls under load
vm.min_free_kbytes = 262144

# Begin background writeback early to avoid large, bursty flushes
# that cause latency spikes and jitter
vm.dirty_background_ratio = 5
# Limit maximum dirty pages to 10% of RAM to prevent multi-GB
# writeback storms under heavy disk activity
vm.dirty_ratio = 10

# Strongly prefer RAM over swap; only swap out cold, unused pages
# Prevents routing daemons and network processes from being swapped
vm.swappiness = 10
