#######################################################################
### HIGH-SPEED TCP / UDP & FILESERVER (COPYPARTY) OPTIMIZATIONS (40G / 16GB)
#######################################################################

# Expand ephemeral port range for high-concurrency termination
net.ipv4.ip_local_port_range                = 1024 65535

############################
### TCP / UDP MEMORY & AUTOTUNING (40G BDP)
############################
# Maximum per-socket buffer sizes (upper autotuning ceiling for TCP/UDP)
net.core.rmem_max                           = 134217728
net.core.wmem_max                           = 134217728

# Initial autotuning targets for TCP/UDP sockets (kernel grows as needed)
net.core.rmem_default                       = 2097152
net.core.wmem_default                       = 2097152


############################
### TCP BUFFERING (High-Burst 40G)
############################
# TCP autotuning limits: [min] [default] [max]
# min:     tiny floor (TCP can grow dynamically)
# default: starting point for autotuning (2 MB)
# max:     upper bound for high-BDP 40G flows
net.ipv4.tcp_rmem                           = 4096 2097152 134217728
net.ipv4.tcp_wmem                           = 4096 2097152 134217728

# Global TCP memory limits (in pages, 4 KB each)
# → 2 GB (low) / 4 GB (pressure) / 6 GB (max)
net.ipv4.tcp_mem                            = 524288 1048576 1572864


############################
### UDP / QUIC BUFFERING (High-Burst 40G)
############################
# Minimum per-socket UDP buffers (UDP has no flow control → must absorb bursts)
net.ipv4.udp_rmem_min                       = 65536
net.ipv4.udp_wmem_min                       = 65536

# Global UDP memory limits (in pages, 4 KB each)
# → 512 MB (low) / 1 GB (pressure) / 2 GB (max)
net.ipv4.udp_mem                            = 131072 262144 524288


############################
### IP FRAGMENTATION (UDP / QUIC / High-Burst Traffic)
############################
# Fragment reassembly buffer thresholds (global)
# Increased for 40G to avoid drops during large bursts of fragmented traffic
net.ipv4.ipfrag_high_thresh                 = 67108864   # 64 MB (stop accepting new fragments)
net.ipv4.ipfrag_low_thresh                  = 50331648   # 48 MB (resume accepting fragments)
