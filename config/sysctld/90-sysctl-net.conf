#######################################################################
### 40G LINUX ROUTER — OPTIMIZED SYSCTL CONFIG (16 GB RAM)
#######################################################################

############################
### CORE ROUTING & FORWARDING
############################
net.ipv4.ip_forward                         = 1   # Enable IPv4 forwarding
net.ipv6.conf.all.forwarding                = 1   # Enable IPv6 forwarding on all interfaces
net.ipv6.conf.default.forwarding            = 1   # Enable IPv6 forwarding on new interfaces


############################
### HIGH-SPEED PACKET PROCESSING (40G NAPI / SOFTIRQ)
############################
net.core.netdev_max_backlog                 = 131072  # Absorb short 40G bursts without drops
# Softirq processing limits
net.core.netdev_budget                      = 8000    # Max packets per softirq cycle (40G optimized)

# Max softirq time slice (4ms) for stable latency
# NOTE: there is a lower limit depending on the distro
# net.core.netdev_budget_usecs                = 4000

# NAPI fairness & throughput
net.core.dev_weight                         = 128     # NAPI packets per poll (balanced for 40G)
net.core.dev_weight_rx_bias                 = 4       # Prioritize RX processing under load
net.core.dev_weight_tx_bias                 = 1       # Keep TX light to avoid starving RX


############################
### MULTICAST / DISCOVERY
############################
net.ipv4.igmp_max_memberships               = 40      # mDNS/SSDP/IGMP robustness


############################
### TCP CONGESTION CONTROL & QUEUING
############################
# NOTE: default_qdisc and tcp_congestion_control are overridden by distro defaults.
# Set them via NIC configuration if you want fq + bbr.
#
# net.core.default_qdisc                      = fq      # Required for BBR pacing
# net.ipv4.tcp_congestion_control             = bbr     # High-speed, low-latency congestion control
net.ipv4.tcp_limit_output_bytes             = 262144  # Keep fq pacing tight (limit un-acked data)


############################
### MODERN TCP BEHAVIOR / LATENCY
############################
net.ipv4.tcp_fastopen                       = 0       # Disable TFO (for security)
net.ipv4.tcp_slow_start_after_idle          = 0       # Prevent slow-start after idle
net.ipv4.tcp_notsent_lowat                  = 16384   # Keep unsent data small for low latency


############################
### NEIGHBOR TABLE (ARP / NDP) — 40G SAFE LIMITS
############################
# IPv4 neighbor table sizing for high-churn 40G networks
net.ipv4.neigh.default.gc_thresh1           = 1024    # Start GC
net.ipv4.neigh.default.gc_thresh2           = 1536    # Aggressive GC
net.ipv4.neigh.default.gc_thresh3           = 2048    # Hard limit

# IPv4 neighbor GC timers (40G)
net.ipv4.neigh.default.gc_interval          = 30      # Run GC every 30s
net.ipv4.neigh.default.gc_stale_time        = 60      # Stale after 60s

# Probe / retry behavior
net.ipv4.neigh.default.delay_first_probe_time = 5     # Wait 5s before first probe
net.ipv4.neigh.default.retrans_time_ms        = 250   # ARP retry every 250 ms

# IPv6 neighbor table sizing
net.ipv6.neigh.default.gc_thresh1           = 2048
net.ipv6.neigh.default.gc_thresh2           = 4096
net.ipv6.neigh.default.gc_thresh3           = 8192

# IPv6 neighbor GC timers (40G)
net.ipv6.neigh.default.gc_interval          = 30      # Run GC every 30s
net.ipv6.neigh.default.gc_stale_time        = 60      # Stale after 60s

# Probing / reachability
net.ipv6.neigh.default.retrans_time_ms      = 250     # NDP retry every 250ms
net.ipv6.neigh.default.base_reachable_time_ms = 30000 # 30s reachable window

# Queueing during unresolved NDP
net.ipv6.neigh.default.unres_qlen_bytes     = 4194304 # 4MB per interface


############################
### IPv6 ROUTING PERFORMANCE
############################
# Route cache / GC
net.ipv6.route.gc_interval                  = 30      # Route GC every 30s
net.ipv6.route.gc_elasticity                = 16      # Burst tolerance
net.ipv6.route.gc_min_interval              = 1       # Min 1s between GCs
net.ipv6.route.max_size                     = 16384   # Cap FIB cache size (router, not DC spine)

# ECMP hashing (if multipath is used)
net.ipv6.fib_multipath_hash_policy          = 1       # L3/L4-based hashing (stable, flow-aware)


############################
### HARDENING & SECURITY
############################
# ARP hardening
# Only reply to ARP requests if the target IP is configured on the receiving interface
net.ipv4.conf.all.arp_ignore                = 1
net.ipv4.conf.default.arp_ignore            = 1
# When sending ARP, always use an IP address that belongs to the outgoing interface (prevents ARP flux)
net.ipv4.conf.all.arp_announce              = 2
net.ipv4.conf.default.arp_announce          = 2

# ICMP hardening
net.ipv4.icmp_ignore_bogus_error_responses  = 1       # Suppress bogus ICMP errors

# TCP hardening
net.ipv4.tcp_syncookies                     = 1       # Protect against SYN floods
net.ipv4.tcp_dsack                          = 1       # Detect unnecessary retransmissions

# Redirect hardening
net.ipv4.conf.all.accept_redirects          = 0
net.ipv4.conf.default.accept_redirects      = 0
net.ipv6.conf.all.accept_redirects          = 0
net.ipv6.conf.default.accept_redirects      = 0

net.ipv4.conf.all.send_redirects            = 0
net.ipv4.conf.default.send_redirects        = 0

net.ipv4.conf.all.secure_redirects          = 0
net.ipv4.conf.default.secure_redirects      = 0

# Source routing hardening
net.ipv4.conf.all.accept_source_route       = 0
net.ipv4.conf.default.accept_source_route   = 0
net.ipv6.conf.all.accept_source_route       = 0
net.ipv6.conf.default.accept_source_route   = 0

# IPv6 RA/autoconf defaults (LAN-safe; WAN interface overrides separately)
net.ipv6.conf.all.accept_ra                 = 0
net.ipv6.conf.default.accept_ra             = 0
net.ipv6.conf.all.autoconf                  = 0
net.ipv6.conf.default.autoconf              = 0
net.ipv6.conf.default.accept_ra_defrtr      = 0
net.ipv6.conf.default.accept_ra_pinfo       = 0
net.ipv6.conf.default.accept_ra_rtr_pref    = 0

# Reverse path filtering (loose mode for routers)
net.ipv4.conf.all.rp_filter                 = 2
net.ipv4.conf.default.rp_filter             = 2


############################
### KERNEL LOG RATE LIMITING
############################
net.core.message_cost                       = 5       # Reduce log spam impact
net.core.message_burst                      = 10      # Limit burst of repeated kernel messages


############################
### TCP TIMEOUTS & MTU PROBING
############################
net.ipv4.tcp_fin_timeout                    = 30
net.ipv4.tcp_keepalive_time                 = 600
net.ipv4.tcp_keepalive_intvl                = 30
net.ipv4.tcp_keepalive_probes               = 5

# MTU probing
net.ipv4.tcp_mtu_probing                    = 1       # Critical for WAN PMTUD


############################
### CONNTRACK (STATEFUL FIREWALL)
############################
net.netfilter.nf_conntrack_max              = 262144
net.netfilter.nf_conntrack_buckets          = 65536

net.netfilter.nf_conntrack_tcp_timeout_established = 1800
net.netfilter.nf_conntrack_tcp_timeout_fin_wait    = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait   = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_recv    = 30

net.netfilter.nf_conntrack_tcp_loose               = 0

# Logging & ARP behavior
net.ipv4.conf.all.log_martians              = 1
net.ipv4.conf.default.log_martians          = 1

net.ipv4.conf.all.proxy_arp                 = 0
net.ipv4.conf.default.proxy_arp             = 0

# Backlog & SYN protection
net.core.somaxconn                          = 8192
net.ipv4.tcp_max_syn_backlog                = 16384
