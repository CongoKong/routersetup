#!/usr/sbin/nft -f

flush ruleset

# --- Variables ---
define lan_if = { "IFLAN" }
define wan_if = { "IFWAN" }
define lan_ip_v6 = LANIPV6ADDRESS

define caddy_verdict = handle_reject  # set to caddy_rules to enable Caddy
define caddy_port = 443

table inet fw {

    # --- Dynamic Sets ---
    set caddy_offenders_v4 {
    typeof ip saddr
    flags dynamic, timeout
    timeout 1h
    comment "IPv4 addresses currently exceeding the 100 connection limit"
    }

    set caddy_offenders_v6 {
    typeof ip6 saddr
    flags dynamic, timeout
    timeout 1h
    comment "IPv6 addresses currently exceeding the 100 connection limit"
    }

    # --- Global Counters ---
    counter dropped_packets {
        comment "Total packets dropped or rejected by firewall"
    }

    counter dropped_syn_flood {
        comment "Packets dropped during a SYN flood"
    }

    counter dropped_invalid {
        comment "Invalid packets dropped"
    }

    counter dropped_caddy_abusive {
        comment "Packets dropped due to abusive Caddy usage"
    }

    # --- Flowtable Definition ---
    flowtable fastflow {
        hook ingress priority filter
        devices = { $lan_if, $wan_if }
        counter
    }

    # --- Input Chain ---
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback
        iif "lo" accept comment "Accept loopback"

        # Conntrack: log + drop invalid, accept established/related
        # ct state invalid limit rate 25/second counter name dropped_invalid log prefix "nft input invalid: " drop
        ct state invalid counter name dropped_invalid drop
        ct state { established, related } accept

        # LAN -> router fully trusted
        iifname $lan_if accept comment "LAN->router (trusted)"

        # Apply SYN flood protection ONLY to WAN
        iifname $wan_if tcp flags syn / fin,syn,rst,ack jump syn_flood

        # WAN input
        iifname $wan_if counter jump input_wan

        jump handle_reject
    }

    # --- Forward Chain ---
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Flowtable offloading – FIRST for fast-path
        ct state established meta l4proto { tcp, udp } flow add @fastflow counter accept

        # Drop/log invalid early
        # ct state invalid limit rate 25/second counter name dropped_invalid log prefix "nft forward invalid: " drop
        ct state invalid counter name dropped_invalid drop

        # Conntrack-based policy
        ct state { established, related } accept
        ct status dnat accept comment "Forward DNATed"

        # New connections
        iifname $lan_if jump forward_lan
        iifname $wan_if counter jump forward_wan

        jump handle_reject
    }

    # --- Output Chain ---
    chain output {
        type filter hook output priority filter; policy accept;

        oif "lo" accept comment "Output loopback"

        ct state invalid counter name dropped_invalid drop
        ct state { established, related } accept
    }

    # --- Utility Chains ---
    # --- Reject Utility ---
    chain handle_reject {
        # Packets are counted once here as they are rejected
        meta l4proto tcp counter name dropped_packets reject with tcp reset
        counter name dropped_packets reject
    }

    # --- SYN Flood Protection ---
    chain syn_flood {
        # WAN-only SYN flood limiter (called only from input on WAN)
        # Accept legitimate high-speed bursts
        tcp flags syn limit rate 500/second burst 250 packets return
        counter name dropped_syn_flood drop
    }

    # --- Forward Chains ---
    # --- LAN Forward ---
    chain forward_lan {
        # LAN → WAN unrestricted
        oifname $wan_if accept comment "LAN->WAN"
    }

    # --- WAN Forward ---
    chain forward_wan {
        # IPSec
        meta l4proto esp accept comment "FWD IPSec ESP"
        udp dport { 500, 4500 } accept comment "FWD IPSec IKE/NAT-T"

        # Granular ICMPv6 forwarding (do not rely on conntrack for these)
        # ICMPv6 Core (Routing/Connectivity)
        icmpv6 type {
            destination-unreachable,
            packet-too-big,
            parameter-problem,
            time-exceeded
        } limit rate 50/second burst 20 packets counter accept comment "FWD ICMPv6 core"

        # ICMPv6 Pings (Diagnostics)
        icmpv6 type {
            echo-request,
            echo-reply
        } limit rate 25/second burst 10 packets counter accept comment "FWD ICMPv6 pings"

        jump handle_reject
    }

    # --- Input Chains ---
    # --- WAN Dispatcher ---
    chain input_wan {
        meta nfproto ipv4 jump input_wan_v4
        meta nfproto ipv6 jump input_wan_v6
    }

    # --- WAN IPv4 path ---
    chain input_wan_v4 {
        # Cheap, strictly control-plane / link semantics first

        # DHCPv4 (client renewals)
        udp dport 68 limit rate 25/second burst 10 packets counter accept comment "WAN DHCPv4 renew"

        # IGMP
        meta l4proto igmp limit rate 25/second burst 10 packets counter accept comment "WAN IGMP"

        # Traceroute (UDP high ports)
        udp dport 33434-33534 limit rate 10/second burst 5 packets counter accept comment "WAN UDP traceroute"

        # Anti-spoofing (RPF/FIB) – protects all following services
        fib saddr . iif oif missing counter name dropped_packets drop comment "WAN IPv4 anti-spoof"

        # ICMPv4 core + ping (after FIB)
        icmp type {
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } limit rate 25/second burst 10 packets counter accept comment "WAN ICMPv4 core"

        icmp type {
            echo-request,
            echo-reply
        } limit rate 10/second burst 5 packets counter accept comment "WAN ICMPv4 ping"

        # Caddy (per-port gating, after FIB)
        tcp dport $caddy_port jump $caddy_verdict
        udp dport $caddy_port jump $caddy_verdict
        # fallthrough → return to chain input → handle_reject
    }

    # --- WAN IPv6 path ---
    chain input_wan_v6 {
        # Cheap, strictly control-plane / link-local first

        # DHCPv6 (client)
        udp dport 546 limit rate 25/second burst 10 packets counter accept comment "WAN DHCPv6 client"

        # ICMPv6 MLD (link-local multicast)
        ip6 saddr fe80::/10 icmpv6 type {
            mld-listener-query,
            mld-listener-report,
            mld-listener-done,
            mld2-listener-report
        } limit rate 25/second burst 10 packets counter accept comment "WAN ICMPv6 MLD"

        # ICMPv6 ND (link-local, hoplimit 255)
        ip6 saddr fe80::/10 icmpv6 type {
            nd-neighbor-solicit,
            nd-neighbor-advert,
            nd-router-advert
        } ip6 hoplimit 255 counter accept comment "WAN ICMPv6 ND"

        # Anti-spoofing (RPF/FIB)
        fib saddr . iif oif missing counter name dropped_packets drop comment "WAN IPv6 anti-spoof"

        # ICMPv6 core + ping (after FIB)
        icmpv6 type {
            destination-unreachable,
            packet-too-big,
            parameter-problem,
            time-exceeded
        } limit rate 25/second burst 10 packets counter accept comment "WAN ICMPv6 core"

        icmpv6 type {
            echo-request,
            echo-reply
        } limit rate 10/second burst 5 packets counter accept comment "WAN ICMPv6 ping limit"

        # Caddy (per-port gating, after FIB)
        tcp dport $caddy_port jump $caddy_verdict
        udp dport $caddy_port jump $caddy_verdict
        # fallthrough → return to chain input → handle_reject
    }

    # Caddy rules
    chain caddy_rules {
        # Caddy Rate Limiting (IPv4 & IPv6)
        # Check if IPs are already in the "jail" (Optional: speeds up processing for known bad actors)
        ip saddr @caddy_offenders_v4 counter name dropped_caddy_abusive drop
        ip6 saddr @caddy_offenders_v6 counter name dropped_caddy_abusive drop

        # TCP: Drop only the connections EXCEEDING 100 and log the IP in the sets
        # Works for both IPv4 and IPv6 in an inet table
        # tcp dport $caddy_port ct count over 100 update @caddy_offenders { ip saddr } \
        #     counter name dropped_caddy_abusive drop
        # IPv4 logic
        meta nfproto ipv4 tcp dport $caddy_port \
            ct count over 100 update @caddy_offenders_v4 { ip saddr } \
            counter name dropped_caddy_abusive drop

        # IPv6 logic
        meta nfproto ipv6 tcp dport $caddy_port \
            ct count over 100 update @caddy_offenders_v6 { ip6 saddr } \
            counter name dropped_caddy_abusive drop

        # Accept all other Caddy TCP traffic
        tcp dport $caddy_port ct state { new, established } counter accept comment "Caddy TCP"
        # UDP (HTTP/3): currently unlimited:
        udp dport $caddy_port ct state { new, established } counter accept comment "Caddy UDP (HTTP/3)"
    }

    # --- NAT ---
    chain srcnat {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $wan_if masquerade comment "WAN MASQ"
    }

    chain dstnat {
        type nat hook prerouting priority dstnat; policy accept;
        iifname $lan_if jump dstnat_lan
    }

    chain dstnat_lan {
        meta nfproto ipv4 jump dstnat_lan_v4
        meta nfproto ipv6 jump dstnat_lan_v6
    }

    # --- IPv4 NAT ---
    chain dstnat_lan_v4 {
        # DNS redirect (TCP+UDP)
        meta l4proto { tcp, udp } th dport 53 counter redirect to :53 comment "LAN DNS v4 redirect"

        # NTP redirect (UDP)
        udp dport 123 counter redirect to :123 comment "LAN NTP v4 redirect"
    }

    # --- IPv6 NAT ---
    chain dstnat_lan_v6 {
        # DNS redirect (TCP+UDP)
        meta l4proto { tcp, udp } th dport 53 counter dnat ip6 to $lan_ip_v6 :53 comment "LAN DNS v6 redirect"

        # NTP redirect (UDP)
        udp dport 123 counter dnat ip6 to $lan_ip_v6 :123 comment "LAN NTP v6 redirect"
    }

    # --- Mangle / MTU Fixing ---
    chain mangle_postrouting {
        type filter hook postrouting priority mangle; policy accept;
        oifname $wan_if tcp flags syn / fin,syn,rst \
            tcp option maxseg size set rt mtu
    }
}
